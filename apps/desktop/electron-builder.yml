appId: com.personalwealth.desktop
productName: Personal Wealth
asar: true
asarUnpack:
  - "**/*.node"
files:
  - out/**
  - "!node_modules/**"
directories:
  output: release
buildDependenciesFromSource: false
npmRebuild: false
mac:
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: ../../build/entitlements.mac.plist
  entitlementsInherit: ../../build/entitlements.mac.inherit.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - x64

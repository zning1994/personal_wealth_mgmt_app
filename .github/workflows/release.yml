name: Desktop release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:privacy
      - run: pnpm test:integration
      - run: pnpm build

  e2e:
    name: Electron critical journey (${{ matrix.os }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pwm/desktop test:e2e

  macos:
    name: macOS ${{ matrix.arch }} signed package
    needs: [preflight, e2e]
    environment: desktop-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install OCR build tools
        run: brew install poppler tesseract
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
      - name: Bundle OCR tools
        run: pnpm --filter @pwm/desktop prepare:ocr
        env:
          PWM_OCR_REQUIRE_TOOLS: "1"
      - name: Rebuild platform native dependencies
        run: pnpm --filter @pwm/desktop rebuild:native
      - name: Stage platform native bindings
        run: pnpm --filter @pwm/desktop prepare:native
      - name: Build desktop app
        run: pnpm --filter @pwm/desktop build
      - name: Validate macOS signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          node -e "for (const name of ['CSC_LINK','CSC_KEY_PASSWORD','APPLE_ID','APPLE_APP_SPECIFIC_PASSWORD','APPLE_TEAM_ID']) if (!process.env[name]) throw new Error('missing release secret: '+name)"
      - run: pnpm --filter @pwm/desktop exec electron-builder --config electron-builder.yml --publish never --mac dmg zip --${{ matrix.arch }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Launch packaged macOS app
        run: pnpm --filter @pwm/desktop test:packaged
      - name: Notarize and staple macOS DMG
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(apps/desktop/release/*.dmg)
          if (( ${#dmgs[@]} == 0 )); then
            echo 'No macOS DMG found to notarize' >&2
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
          done
      - name: Verify signed app bundle
        run: bash scripts/release/verify-macos-signature.sh apps/desktop/release
      - uses: actions/upload-artifact@v4
        with:
          name: personal-wealth-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: apps/desktop/release/*

  windows:
    name: Windows x64 unsigned package
    needs: [preflight, e2e]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install OCR build tools
        shell: pwsh
        env:
          POPPLER_VERSION: "26.02.0-0"
          POPPLER_SHA256: "993e4a94376ed712fafc7058d724ea0b943d118bbd2305cd9ed55174eb85cda5"
        run: |
          choco install tesseract --no-progress --yes

          $archive = Join-Path $env:RUNNER_TEMP "poppler-$env:POPPLER_VERSION.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "poppler-$env:POPPLER_VERSION"
          $downloadUrl = "https://github.com/oschwartz10612/poppler-windows/releases/download/v$env:POPPLER_VERSION/Release-$env:POPPLER_VERSION.zip"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $env:POPPLER_SHA256) {
            throw "Poppler checksum mismatch: expected $env:POPPLER_SHA256, got $actualSha256"
          }
          Remove-Item -LiteralPath $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot -Force

          $pdftoppm = Get-ChildItem -LiteralPath $extractRoot -Filter pdftoppm.exe -Recurse -File | Select-Object -First 1
          if (-not $pdftoppm) { throw "Prebuilt Poppler archive did not contain pdftoppm.exe" }

          $chocolateyRoot = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { 'C:\ProgramData\chocolatey' }
          $tesseractRoots = @(
            'C:\Program Files\Tesseract-OCR',
            (Join-Path $chocolateyRoot 'lib\tesseract\tools')
          )
          $tesseract = $null
          foreach ($root in $tesseractRoots) {
            if (Test-Path -LiteralPath $root) {
              $tesseract = Get-ChildItem -LiteralPath $root -Filter tesseract.exe -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($tesseract) { break }
            }
          }
          if (-not $tesseract) { throw 'Tesseract installation did not contain tesseract.exe' }
          $tessdata = Join-Path $tesseract.Directory.FullName 'tessdata'
          if (-not (Test-Path -LiteralPath $tessdata)) { throw "Tesseract tessdata directory not found: $tessdata" }

          "PWM_OCR_PDF_RENDERER_SOURCE=$($pdftoppm.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PWM_OCR_TESSERACT_SOURCE=$($tesseract.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PWM_OCR_TESSDATA_SOURCE=$tessdata" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $pdftoppm.FullName -h 2>&1 | Select-Object -First 1
          & $tesseract.FullName --version | Select-Object -First 1
      - name: Bundle OCR tools
        run: pnpm --filter @pwm/desktop prepare:ocr
        env:
          PWM_OCR_REQUIRE_TOOLS: "1"
      - name: Rebuild platform native dependencies
        run: pnpm --filter @pwm/desktop rebuild:native
      - name: Stage platform native bindings
        run: pnpm --filter @pwm/desktop prepare:native
      - name: Build desktop app
        run: pnpm --filter @pwm/desktop build
      - run: pnpm --filter @pwm/desktop exec electron-builder --config electron-builder.yml --publish never --win nsis --x64
      - name: Launch packaged Windows app
        run: pnpm --filter @pwm/desktop test:packaged
      - name: Write unsigned disclosure
        shell: pwsh
        run: Set-Content -Path apps/desktop/release/WINDOWS-UNSIGNED.txt -Value 'Personal Wealth v0.1.0 Windows package is unsigned. Verify the downloaded checksum and install only if you trust the source.'
      - uses: actions/upload-artifact@v4
        with:
          name: personal-wealth-windows-x64-unsigned
          if-no-files-found: error
          path: apps/desktop/release/*

  draft-release:
    name: Create draft GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: personal-wealth-*
          path: release-assets
          merge-multiple: true
      - run: sha256sum release-assets/* | tee release-assets/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
